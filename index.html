<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agent Office</title>
  <link rel="icon" href="data:,">
</head>
<body>
<main class="stage">
  <div id="scene" aria-label="3D office with agent characters"></div>
  <div id="status" class="status" role="status">Loading the 3D office…</div>

  <header class="brand">
    <h1>Agent Office</h1>
  </header>
  <div id="lab-strip" class="lab-strip lab-only" aria-label="Sessions at a glance"></div>
  <div class="left">
    <div id="layout-picker" class="layout-picker" role="group" aria-label="Office layout"></div>
    <div id="theme-picker" class="layout-picker" role="group" aria-label="Seasonal theme"></div>
    <aside id="usage" class="usage" aria-label="Plan usage"></aside>
    <aside id="lab-needs" class="usage lab-only" aria-label="Waiting on you" hidden></aside>
    <aside id="projects" class="usage" aria-label="Projects" hidden></aside>
  </div>

  <aside class="card" id="card" aria-live="polite" hidden></aside>
  <aside id="lab-popup" class="lab-popup lab-only" aria-live="polite" aria-label="Needs you" hidden></aside>
  <aside id="lab-feed" class="lab-feed lab-only" aria-label="Activity" hidden></aside>
  <div id="tooltip" class="tooltip" hidden></div>
  <button id="home" class="btn icon home" type="button" title="Back to the starting view (Home)" aria-label="Back to the starting view">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h3l1.5-2.5h6L16.5 7h3A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>
      <circle cx="12" cy="13" r="3.5"/>
    </svg>
  </button>
  <div id="tilt" class="tilt" role="group" aria-label="Camera tilt" hidden></div>
  <button id="zoom" class="btn icon zoom" type="button" aria-pressed="false" title="Close-up view" aria-label="Close-up view">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="6.5"/>
      <path d="M15.5 15.5 21 21M8 10.5h5M10.5 8v5"/>
    </svg>
  </button>
  <button id="assistant" class="btn icon assistant" type="button" aria-pressed="false" title="Catch me up and ask the office" aria-label="Catch me up and ask the office" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <path d="M11 2.5l1.9 5.1 5.1 1.9-5.1 1.9L11 16.5l-1.9-5.1L4 9.5l5.1-1.9z"/>
      <path d="M18.5 14l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/>
    </svg>
  </button>
  <aside id="assistant-panel" class="card assistant-panel" aria-label="Catch me up" hidden>
    <header><h2>Catch me up</h2><button class="btn icon" type="button" data-close aria-label="Close">×</button></header>
    <div class="briefing" data-briefing aria-live="polite"></div>
    <form class="ask" data-ask>
      <label class="label" for="ask-input">Ask the office</label>
      <div class="ask-row"><input id="ask-input" name="question" maxlength="500" autocomplete="off" placeholder="What's waiting on me?"><button class="btn primary" type="submit">Ask</button></div>
    </form>
    <div class="answer" data-answer aria-live="polite" hidden></div>
    <label class="voice"><input type="checkbox" data-voice> The desktop pet reads updates out loud</label>
  </aside>
  <button id="pet" class="btn icon pet" type="button" title="Bring back the desktop pet" aria-label="Bring back the desktop pet" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <ellipse cx="12" cy="16" rx="5" ry="4.2"/>
      <ellipse cx="5.5" cy="10.5" rx="2.1" ry="2.6"/><ellipse cx="9.3" cy="6.3" rx="2.1" ry="2.7"/>
      <ellipse cx="14.7" cy="6.3" rx="2.1" ry="2.7"/><ellipse cx="18.5" cy="10.5" rx="2.1" ry="2.6"/>
    </svg>
  </button>
  <button id="background" class="btn icon background" type="button" aria-pressed="false" title="Sky or plain background" aria-label="Plain background">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="8"/>
      <path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>
    </svg>
  </button>
</main>
<script type="module" src="/src/client/main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agent Office</title>
  <link rel="icon" href="data:,">
</head>
<body>
<main class="stage">
  <div id="scene" aria-label="3D office with agent characters"></div>
  <div id="status" class="status" role="status">Loading the 3D office…</div>

  <header class="brand">
    <h1>Agent Office</h1>
  </header>
  <div class="left">
    <div id="layout-picker" class="layout-picker" role="group" aria-label="Office layout"></div>
    <div id="theme-picker" class="layout-picker" role="group" aria-label="Seasonal theme"></div>
    <aside id="usage" class="usage" aria-label="Plan usage"></aside>
    <aside id="projects" class="usage" aria-label="Projects" hidden></aside>
  </div>

  <aside class="card" id="card" aria-live="polite" hidden></aside>
  <div id="tooltip" class="tooltip" hidden></div>
  <button id="home" class="btn icon home" type="button" title="Back to the starting view (Home)" aria-label="Back to the starting view">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h3l1.5-2.5h6L16.5 7h3A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>
      <circle cx="12" cy="13" r="3.5"/>
    </svg>
  </button>
  <button id="zoom" class="btn icon zoom" type="button" aria-pressed="false" title="Close-up view" aria-label="Close-up view">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="6.5"/>
      <path d="M15.5 15.5 21 21M8 10.5h5M10.5 8v5"/>
    </svg>
  </button>
  <button id="pet" class="btn icon pet" type="button" title="Bring back the desktop pet" aria-label="Bring back the desktop pet" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <ellipse cx="12" cy="16" rx="5" ry="4.2"/>
      <ellipse cx="5.5" cy="10.5" rx="2.1" ry="2.6"/><ellipse cx="9.3" cy="6.3" rx="2.1" ry="2.7"/>
      <ellipse cx="14.7" cy="6.3" rx="2.1" ry="2.7"/><ellipse cx="18.5" cy="10.5" rx="2.1" ry="2.6"/>
    </svg>
  </button>
  <button id="background" class="btn icon background" type="button" aria-pressed="false" title="Sky or plain background" aria-label="Plain background">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="8"/>
      <path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>
    </svg>
  </button>
</main>
<script type="module" src="/src/client/main.ts"></script>
</body>
</html>
